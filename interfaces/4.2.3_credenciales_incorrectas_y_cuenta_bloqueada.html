<script>
        // Micro-interaction: Subtle shake effect on the card for visual error emphasis
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('main');
            card.style.transform = 'translateX(0)';
            
            const shake = () => {
                const intensity = 4;
                const duration = 50;
                const steps = [intensity, -intensity, intensity, -intensity, 0];
                
                steps.forEach((offset, index) => {
                    setTimeout(() => {
                        card.style.transform = `translateX(${offset}px)`;
                        card.style.transition = 'transform 0.05s ease-in-out';
                    }, index * duration);
                });
            };
            
            // Trigger shake once on load to highlight error state
            setTimeout(shake, 400);
        });
    </script>

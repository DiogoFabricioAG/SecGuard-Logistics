<body class="h-full bg-background overflow-hidden flex items-center justify-center p-md">
<!-- Background Layer -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-login-hero"></div>
<div class="absolute inset-0 bg-[#00333c] opacity-[0.55]"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full flex justify-center items-center">
<div class="card-custom w-full rounded-lg shadow-xl p-xl flex flex-col items-center">
<!-- Header -->
<header class="text-center w-full">
<div class="mb-md">
<span class="material-symbols-outlined text-[40px] text-primary-fixed-dim" data-icon="shield">shield</span>
</div>
<h1 class="font-headline-md text-[28px] font-bold text-primary-container leading-tight">SecGuard Logistics</h1>
<p class="font-label-md text-[14px] font-semibold text-on-surface-variant mt-xs">Control de acceso vehicular</p>
<p class="font-body-md text-[13px] font-normal text-outline mt-xs">Ingrese sus credenciales</p>
</header>
<!-- Separator -->
<hr class="w-full border-t border-outline-variant my-lg"/>
<!-- Form -->
<form action="#" class="w-full space-y-md" method="POST" onsubmit="return false;">
<div>
<label class="block font-label-md text-[12px] font-semibold text-on-surface-variant mb-xs" for="username">Usuario</label>
<input class="w-full h-[40px] bg-surface-container-lowest border border-outline-variant rounded-lg px-md text-on-surface font-body-md input-focus-effect transition-all" id="username" name="username" placeholder="ej. JuanPerez" type="text"/>
</div>
<div>
<label class="block font-label-md text-[12px] font-semibold text-on-surface-variant mb-xs" for="password">Contraseña</label>
<input class="w-full h-[40px] bg-surface-container-lowest border border-outline-variant rounded-lg px-md text-on-surface font-body-md input-focus-effect transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full h-[44px] bg-primary-container hover:bg-primary text-on-primary font-label-md text-[14px] font-semibold rounded-lg transition-colors active:scale-[0.98] mt-lg" type="submit">
                    Iniciar sesión
                </button>
</form>
<!-- Forgot Password Link -->
<div class="mt-md text-center">
<a class="font-body-md text-[13px] text-on-primary-fixed-variant hover:underline transition-all" href="#">
                    ¿Olvidó su contraseña?
                </a>
</div>
<!-- Footer Inside Card -->
<footer class="mt-lg pt-md text-center">
<p class="font-label-sm text-[11px] font-normal text-outline leading-normal">
                    © 2026 SecGuard Logistics.<br/>Secure Global Supply Chain Management.
                </p>
</footer>
</div>
</main>
<!-- Micro-interaction for feedback -->
<script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const btn = this.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Verificando...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                // Mock behavior: just reset the state
            }, 1500);
        });
    </script>
</body></html>

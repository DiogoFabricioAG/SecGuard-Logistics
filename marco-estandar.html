<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>SecGuard Logistics</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#001d22",
            "on-primary": "#ffffff",
            "primary-container": "#00333c",
            "on-primary-container": "#659eab",
            "secondary": "#006e2b",
            "surface": "#faf9fb",
            "surface-container": "#eeedf0",
            "surface-variant": "#e2e2e3",
            "on-surface": "#1a1c1d",
            "on-surface-variant": "#41484a",
            "outline": "#70787b",
            "outline-variant": "#bfc8ca",
            "error": "#ba1a1a",
            "primary-fixed-dim": "#96d0de",
            "border-subtle": "#EEEEEF"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          spacing: {
            "xs": "4px",
            "lg": "24px",
            "sm": "8px",
            "md": "16px",
            "sidebar-width": "220px"
          },
          fontFamily: {
            "headline": ["Manrope", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface overflow-hidden">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="fixed left-0 top-0 w-[220px] h-screen bg-white flex flex-col py-lg z-50 border-r border-border-subtle">

    <!-- Logo -->
    <div class="px-md mb-xl">
      <div class="flex items-center gap-sm mb-1">
        <span class="material-symbols-outlined text-[24px]" style="color: #00333c;">local_shipping</span>
        <div class="flex flex-col">
          <span class="font-headline text-[13px] font-bold text-primary-container leading-none">SecGuard</span>
          <span class="font-headline text-[13px] font-bold text-primary-container leading-none">Logistics</span>
        </div>
      </div>
      <p class="text-[10px] font-normal text-outline pl-[32px]">Centro Logístico Global</p>
    </div>

    <!-- Nav Links -->
    <nav class="flex-1 px-sm space-y-1">
      <a class="flex items-center gap-md px-md py-[10px] rounded-[6px] text-on-surface-variant hover:bg-surface-container transition-colors" href="#">
        <span class="material-symbols-outlined text-[20px]">dashboard</span>
        <span class="text-[13px] font-medium">Dashboard</span>
      </a>
      <a class="flex items-center gap-md px-md py-[10px] transition-colors rounded-[6px] bg-primary-container text-white" href="#">
        <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
        <span class="text-[13px] font-medium">Flota</span>
      </a>
      <a class="flex items-center gap-md px-md py-[10px] text-on-surface-variant hover:bg-surface-container transition-colors rounded-[6px]" href="#">
        <span class="material-symbols-outlined text-[20px]">route</span>
        <span class="text-[13px] font-medium">Rutas</span>
      </a>
      <a class="flex items-center gap-md px-md py-[10px] text-on-surface-variant hover:bg-surface-container transition-colors rounded-[6px]" href="#">
        <span class="material-symbols-outlined text-[20px]">build</span>
        <span class="text-[13px] font-medium">Mantenimiento</span>
      </a>
      <a class="flex items-center gap-md px-md py-[10px] text-on-surface-variant hover:bg-surface-container transition-colors rounded-[6px]" href="#">
        <span class="material-symbols-outlined text-[20px]">analytics</span>
        <span class="text-[13px] font-medium">Analítica</span>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="px-sm mt-auto space-y-1">
      <a class="flex items-center gap-md px-md py-[10px] text-on-surface-variant hover:bg-surface-container transition-colors rounded-[6px]" href="#">
        <span class="material-symbols-outlined text-[20px]">help_outline</span>
        <span class="text-[13px] font-medium">Soporte</span>
      </a>
      <a class="flex items-center gap-md px-md py-[10px] text-error hover:bg-error/5 transition-colors rounded-[6px]" href="#">
        <span class="material-symbols-outlined text-[20px]">logout</span>
        <span class="text-[13px] font-medium">Cerrar Sesión</span>
      </a>
    </div>

  </aside>
  <!-- ===================== FIN SIDEBAR ===================== -->

  <!-- ===================== ÁREA PRINCIPAL ===================== -->
  <main class="ml-[220px] flex flex-col h-screen">

    <!-- Header -->
    <header class="h-[48px] bg-white border-b border-border-subtle flex items-center justify-between px-lg z-40 flex-shrink-0">
      <h1 class="font-headline text-[20px] font-semibold text-on-surface">
        <!-- TÍTULO DE LA PANTALLA: editar aquí -->
        Título
      </h1>
      <div class="flex items-center gap-md">
        <!-- Notificaciones -->
        <button class="relative w-8 h-8 flex items-center justify-center text-on-surface-variant">
          <span class="material-symbols-outlined">notifications</span>
          <span class="absolute top-1 right-1 w-4 h-4 bg-error text-white text-[10px] flex items-center justify-center rounded-full font-bold">3</span>
        </button>
        <!-- Configuración -->
        <button class="w-8 h-8 flex items-center justify-center text-on-surface-variant">
          <span class="material-symbols-outlined">settings</span>
        </button>
        <!-- Avatar usuario -->
        <div class="relative w-9 h-9 rounded-full flex items-center justify-center cursor-pointer overflow-hidden" style="background-color: #00333c;">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
            <rect width="40" height="40" fill="#00333c"></rect>
            <path d="M20 21C23.866 21 27 17.866 27 14C27 10.134 23.866 7 20 7C16.134 7 13 10.134 13 14C13 17.866 16.134 21 20 21ZM20 24C14.66 24 4 26.67 4 32V35H36V32C36 26.67 25.34 24 20 24Z" fill="white"></path>
          </svg>
        </div>
      </div>
    </header>

    <!-- ===================== CONTENIDO: reemplazar este bloque en cada pantalla ===================== -->
    <section class="flex-1 p-lg overflow-y-auto">
      <!-- CONTENIDO DE LA PANTALLA -->
    </section>
    <!-- ===================== FIN CONTENIDO ===================== -->

  </main>
  <!-- ===================== FIN ÁREA PRINCIPAL ===================== -->

</body>
</html>

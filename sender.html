<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CamStream — Celular</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--border:#393836;--divider:#262523;--text:#cdccca;--muted:#797876;--faint:#5a5957;--primary:#4f98a3;--primary-h:#227f8b;--success:#6daa45;--warning:#bb653b;--error:#d163a7;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-full:9999px;--font:'Satoshi',system-ui,sans-serif;--tr:180ms cubic-bezier(.16,1,.3,1)}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:clamp(1rem,.95rem + .25vw,1.125rem);display:flex;flex-direction:column}
  video,canvas{display:block}
  button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;transition:all var(--tr)}

  .header{padding:1rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  .logo{display:flex;align-items:center;gap:.5rem;font-weight:700;color:var(--primary)}
  .badge{font-size:.75rem;padding:.1rem .5rem;border-radius:var(--r-full);background:var(--surface2);border:1px solid var(--border);color:var(--muted)}

  .main{flex:1;padding:1.25rem;display:flex;flex-direction:column;gap:1.25rem;max-width:480px;margin:0 auto;width:100%}

  /* Status */
  .status{display:flex;align-items:center;gap:.625rem;padding:.75rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);font-size:.875rem}
  .dot{width:8px;height:8px;border-radius:var(--r-full);flex-shrink:0;background:var(--faint)}
  .dot.loading{background:var(--warning);animation:pulse 1.2s infinite}
  .dot.connected{background:var(--success)}
  .dot.streaming{background:var(--primary);animation:pulse 1.2s infinite}
  .dot.error{background:var(--error)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* ID box */
  .id-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:1.25rem;display:flex;flex-direction:column;gap:.75rem}
  .id-label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .id-value{font-size:1.5rem;font-weight:700;color:var(--primary);letter-spacing:.1em;font-variant-numeric:tabular-nums;word-break:break-all}
  .id-hint{font-size:.8rem;color:var(--muted)}

  /* QR placeholder */
  .qr-wrap{display:flex;justify-content:center}
  #qrCanvas{border-radius:var(--r-lg);border:1px solid var(--border)}

  /* Camera preview */
  .cam-wrap{position:relative;aspect-ratio:9/16;background:#000;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--border)}
  #localVideo{width:100%;height:100%;object-fit:cover}
  .cam-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity var(--tr)}
  .cam-overlay.hidden{opacity:0;pointer-events:none}
  .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:var(--r-md);font-size:.9rem;font-weight:600;width:100%;border:1px solid transparent}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-h)}
  .btn-primary:active{transform:scale(.97)}
  .btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn-secondary:hover{background:var(--surface2)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .info-note{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.5}
</style>
</head>
<body>
<header class="header">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M2 8a2 2 0 0 1 2-2h1l2-3h6l2 3h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    CamStream
  </div>
  <span class="badge">📱 Celular</span>
</header>

<main class="main">
  <div class="status"><div class="dot loading" id="dot"></div><span id="statusMsg">Generando ID de sesion...</span></div>

  <div class="id-card">
    <div class="id-label">Tu ID de sesion</div>
    <div class="id-value" id="peerId">---</div>
    <div class="id-hint">Ingresa este codigo en la PC para conectar</div>
  </div>

  <div class="qr-wrap"><canvas id="qrCanvas" width="180" height="180"></canvas></div>

  <div class="cam-wrap">
    <video id="localVideo" autoplay muted playsinline></video>
    <div class="cam-overlay" id="camOverlay"><div class="spinner"></div></div>
  </div>

  <button class="btn btn-secondary" id="flipBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
    Cambiar Camara
  </button>

  <p class="info-note">La PC debe abrir <strong>receiver.html</strong> e ingresar el ID de arriba para conectarse.</p>
</main>

<script>
// Mini QR encoder using simple matrix (no external lib needed for short strings)
// We'll use a URL approach with a public QR API
function drawQR(text) {
  const canvas = document.getElementById('qrCanvas');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, 180, 180); };
  img.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(text)}&bgcolor=1c1b19&color=4f98a3&qzone=1`;
}

const dot = document.getElementById('dot');
const statusMsg = document.getElementById('statusMsg');
const peerIdEl = document.getElementById('peerId');
const camOverlay = document.getElementById('camOverlay');
const flipBtn = document.getElementById('flipBtn');
let localStream = null, facing = 'environment', peer = null;

function setStatus(type, msg) { dot.className = 'dot ' + type; statusMsg.textContent = msg; }

// Init PeerJS — uses free PeerJS cloud server
peer = new Peer({ debug: 0 });

peer.on('open', id => {
  peerIdEl.textContent = id;
  setStatus('connected', 'Listo — esperando conexion de la PC');
  drawQR(id);
  startCamera();
});

peer.on('error', e => { setStatus('error', 'Error: ' + e.type); });

peer.on('call', call => {
  call.answer(localStream);
  setStatus('streaming', 'Transmitiendo a la PC...');
  call.on('close', () => setStatus('connected', 'PC desconectada — esperando...'));
  call.on('error', () => setStatus('error', 'Error en la llamada'));
});

async function startCamera() {
  try {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    document.getElementById('localVideo').srcObject = localStream;
    camOverlay.classList.add('hidden');
  } catch(e) {
    setStatus('error', 'Sin acceso a la camara');
  }
}

flipBtn.addEventListener('click', () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  startCamera();
});
</script>
</body>
</html>
